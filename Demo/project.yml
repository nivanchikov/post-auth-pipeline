name: AuthDemo
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
packages:
  Auth:
    path: ..
targets:
  AuthDemo:
    type: application
    platform: iOS
    sources: [AuthDemo]
    dependencies:
      - package: Auth
        product: Auth
      - package: Auth
        product: OperationPipeline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.AuthDemo
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
